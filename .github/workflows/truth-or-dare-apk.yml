name: Build Truth or Dare APK

on:
  push:
    branches: [main]
    paths:
      - "truth-or-dare/**"
      - ".github/workflows/truth-or-dare-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Truth or Dare debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract game source
        run: |
          mkdir -p truth-or-dare/www
          base64 --decode truth-or-dare/source.zip.b64 > /tmp/truth-or-dare.zip
          unzip -o /tmp/truth-or-dare.zip -d truth-or-dare/www

      - name: Install dependencies
        working-directory: truth-or-dare
        run: npm install

      - name: Generate Android project
        working-directory: truth-or-dare
        run: npx cap add android

      - name: Sync web assets
        working-directory: truth-or-dare
        run: npx cap sync android

      - name: Build APK
        working-directory: truth-or-dare
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Truth-or-Dare-debug-APK
          path: truth-or-dare/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
